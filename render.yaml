databases:
  - name: impactledger-db
    databaseName: impactledger
    user: impactledger_user
    plan: free

services:
  # Backend Express API Service
  - type: web
    name: impactledger-api
    runtime: node
    plan: free
    rootDir: your-project
    buildCommand: npm install && npm run build:api
    preDeployCommand: npx prisma migrate deploy && npx tsx prisma/seed.ts
    startCommand: npm run start:api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: impactledger-db
          property: connectionString
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: impactledger-web
          property: host
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: AI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_WEBHOOK_ID
        sync: false

  # Frontend Vite Static Site
  - type: web
    name: impactledger-web
    runtime: static
    plan: free
    rootDir: your-project
    buildCommand: npm install && npm run build:web
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: impactledger-api
          property: host

